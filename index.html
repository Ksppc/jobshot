<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cove" />
<meta name="theme-color" content="#0A1E24" />
<title>Cove</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    /* deep ocean base, lagoon teal for action, mango for attention */
    --bg:#0A1E24; --panel:#102D36; --panel2:#163B46; --line:#1E4A57;
    --txt:#EAF4F1; --muted:#8FB2B1; --accent:#F6A15C; --accent2:#2FB8A6;
    --ok:#3FCF8E; --err:#FF6F6B;
    --r:14px;              /* one corner radius everywhere */
    --gap:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  button{font:inherit;color:inherit;cursor:pointer}
  .app{display:flex;flex-direction:column;height:100dvh}
  header{display:flex;align-items:center;gap:10px;padding:12px var(--gap);
    padding-top:calc(12px + env(safe-area-inset-top));
    background:linear-gradient(180deg,#0D2630,#0A1E24);border-bottom:1px solid var(--line)}
  header .brand{font-weight:700;letter-spacing:1.2px;font-size:17px;display:flex;align-items:center;gap:9px}
  /* a small sun over the water — the only ornament in the app */
  header .mark{width:19px;height:19px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 34% 32%,#FFC98A,var(--accent) 62%,#D9793A);
    box-shadow:0 0 0 3px rgba(246,161,92,.16)}
  header .spacer{flex:1}
  .iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:14px;color:var(--txt)}
  .iconbtn:active{background:#1B4552}
  .target{display:flex;gap:8px;align-items:center;padding:9px var(--gap);background:var(--panel);
    border-bottom:1px solid var(--line);font-size:13px}
  .target .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw;letter-spacing:.2px}
  .target .pill b{color:var(--txt);font-weight:700}
  .target .change{margin-left:auto;color:var(--accent2);font-weight:700;background:none;border:0;letter-spacing:.3px}
  .stage{position:relative;flex:1;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
  video,canvas.preview{width:100%;height:100%;object-fit:cover;display:block}
  .hud{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;
    background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none;font-size:12px;color:#dfe7f5}
  .hud .row{display:flex;gap:12px;flex-wrap:wrap}
  .zoombar{position:absolute;left:10%;right:10%;bottom:54px;display:none;align-items:center;gap:8px;z-index:5}
  .zoombar.on{display:flex}
  .zoombar input[type=range]{flex:1;accent-color:var(--accent);height:26px}
  .zoombar .zlbl{font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);border-radius:999px;padding:3px 9px;min-width:40px;text-align:center}
  .controls{display:flex;align-items:center;justify-content:center;gap:28px;
    padding:16px var(--gap) calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#0A1E24,#0D2630);border-top:1px solid var(--line)}
  .shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #DCEAE7;
    box-shadow:0 0 0 4px #0A1E24,0 0 0 6px var(--accent2);transition:transform .1s}
  .shutter:active{transform:scale(.94)}
  .mini{width:52px;height:52px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .mini:active{background:#1B4552}
  .sheet{position:fixed;inset:0;background:rgba(4,14,18,.74);display:none;align-items:flex-end;z-index:40}
  .sheet.open{display:flex}
  .sheet .card{background:var(--panel);width:100%;max-height:88dvh;overflow:auto;border-top-left-radius:22px;
    border-top-right-radius:22px;border:1px solid var(--line);border-bottom:0;
    padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  /* grab handle — signals the sheet is a drawer, not a page */
  .sheet .card::before{content:"";display:block;width:38px;height:4px;border-radius:999px;
    background:var(--line);margin:-6px auto 14px}
  .sheet h2{margin:2px 0 16px;font-size:18px;letter-spacing:.3px}
  label.f{display:block;margin:14px 0 6px;font-size:12px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  input[type=text]{width:100%;padding:13px;border-radius:var(--r);border:1px solid var(--line);
    background:#0A2028;color:var(--txt);font-size:15px}
  input[type=text]:focus{outline:0;border-color:var(--accent2)}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:var(--r);border:0;
    font-weight:700;font-size:15px;margin-top:12px;letter-spacing:.2px}
  .btn.primary{background:var(--accent);color:#2A1605}
  .btn.blue{background:var(--accent2);color:#04231F}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
  .btn[disabled]{opacity:.4;cursor:default}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
  .crumbs{display:flex;flex-wrap:wrap;gap:5px;font-size:13px;margin-bottom:10px;align-items:center}
  .crumbs span{color:var(--accent2);cursor:pointer;font-weight:600}
  .crumbs span:last-child{color:var(--muted);cursor:default}
  .crumbs i{color:var(--line);font-style:normal}
  .folderlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0A2028}
  .folderlist .item{display:flex;align-items:center;gap:11px;padding:14px 13px;
    border-bottom:1px solid var(--line);font-size:15px}
  .folderlist .item:last-child{border-bottom:0}
  .folderlist .item:active{background:var(--panel2)}
  .folderlist .item .use{margin-left:auto;color:var(--accent2);font-weight:700;font-size:13px}
  .logo-prev{height:40px;margin-top:8px;background:#fff;border-radius:8px;padding:4px;display:none}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;display:none;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .toast.show{display:block}
  .toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
  .status{font-size:12px;color:var(--muted);text-align:center;padding:4px;min-height:20px}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;color:var(--muted)}
  .center .big{font-size:40px;margin-bottom:10px}
  .gallery{position:absolute;left:12px;bottom:70px;display:flex;gap:6px}
  .gallery img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:2px solid #fff9}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark"></span>COVE</div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnSignin">Sign in</button>
    <button class="iconbtn" id="btnSettings">&#9881;</button>
  </header>

  <div class="target">
    <div class="pill" id="pillJob">Job#: <b>&mdash;</b></div>
    <div class="pill" id="pillLoc">Loc: <b>&mdash;</b></div>
    <button class="change" id="btnPickFolder">Change</button>
  </div>

  <div class="stage" id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas class="preview" id="canvas" style="display:none"></canvas>
    <div class="gallery" id="gallery"></div>
    <div class="hud"><div class="row" id="hudRow"></div></div>
    <div class="zoombar" id="zoombar">
      <span class="zlbl" id="zlbl">1.0&times;</span>
      <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" aria-label="Zoom" />
    </div>
    <div class="center" id="camMsg" style="display:none">
      <div class="big">&#128247;</div>
      <div id="camMsgTxt">Starting camera&hellip;</div>
    </div>
  </div>

  <div class="status" id="statusLine"></div>

  <div class="controls">
    <button class="mini" id="btnFlip" title="Flip camera">&#128260;</button>
    <button class="shutter" id="btnShutter" aria-label="Take photo"></button>
    <button class="mini" id="btnFile" title="Full-res photo from camera">&#128444;</button>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" />
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet" id="sheetSettings">
  <div class="card">
    <h2>Settings</h2>
    <label class="f">Google OAuth Client ID</label>
    <input type="text" id="inClientId" placeholder="1234567890-abc.apps.googleusercontent.com" autocomplete="off" />
    <div class="hint">Already configured. Only change this if you rebuild the Google project.</div>

    <label class="f">Location (stamped on every photo)</label>
    <input type="text" id="inLocation" placeholder="PPC" />

    <label class="f">Watermark logo (PNG with transparent background is best)</label>
    <button class="btn ghost" id="btnLogo">Choose logo image&hellip;</button>
    <input type="file" id="logoInput" accept="image/*" style="display:none" />
    <img class="logo-prev" id="logoPrev" alt="logo preview" />

    <button class="btn primary" id="btnSaveSettings">Save</button>
    <button class="btn ghost" id="btnCloseSettings">Close</button>
    <div class="hint" id="signedState"></div>
  </div>
</div>

<!-- Folder picker sheet -->
<div class="sheet" id="sheetFolder">
  <div class="card">
    <h2>Choose job folder</h2>
    <div class="crumbs" id="crumbs"></div>
    <div class="folderlist" id="folderList"></div>
    <button class="btn blue" id="btnUseThis">Use this folder</button>
    <button class="btn ghost" id="btnCloseFolder">Cancel</button>
    <div class="hint">Only job folders inside <b id="rootLabel"></b> can be picked. The folder name becomes the Job#. A job code like PPC-2026-056 is detected automatically.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
/* ---------- config / state ---------- */
var SCOPE = "https://www.googleapis.com/auth/drive";
var LS = { clientId:"pjs_client_id", location:"pjs_location", logo:"pjs_logo",
  folderId:"pjs_folder_id", folderName:"pjs_folder_name", cfgVer:"pjs_cfg_version",
  token:"pjs_token", tokenExp:"pjs_token_exp" };
var DEFAULT_LOCATION = "PPC";
var OLD_LOCATIONS = ["PPC Edmonton Shop"];  // auto-migrate any legacy default to PPC
var DEFAULT_CLIENT_ID = "554927118785-cu08jfujbaanb6dprjsq5uqfhm59nveg.apps.googleusercontent.com";
var JPEG_QUALITY = 1.0;

/* ---------- production photo root ----------
   The picker is pinned to this folder. The crew can only choose job folders
   INSIDE it — never My Drive, never anything alongside it. To move the app to a
   different parent folder, change these two lines and bump CONFIG_VERSION so
   every device is forced to re-pick. */
var ROOT_FOLDER_ID   = "1FPI2k3OlTUY90dfz1Ke9qiJ3BkTXDiFu";
var ROOT_FOLDER_NAME = "PPC Shop Production Photo's";
var CONFIG_VERSION   = 2;

/* Devices that picked a folder under the old "browse all of My Drive" build still
   have it saved. Those saved folders live outside the root, so clear them once and
   make the device pick again from the pinned list. */
(function migrateSavedFolder(){
  var seen = +(localStorage.getItem(LS.cfgVer) || 0);
  if(seen < CONFIG_VERSION){
    localStorage.removeItem(LS.folderId);
    localStorage.removeItem(LS.folderName);
    localStorage.setItem(LS.cfgVer, String(CONFIG_VERSION));
  }
})();

var state = {
  token:null, tokenClient:null,
  clientId: localStorage.getItem(LS.clientId) || DEFAULT_CLIENT_ID,
  location: (function(v){ return (!v || OLD_LOCATIONS.indexOf(v)>=0) ? DEFAULT_LOCATION : v; })(localStorage.getItem(LS.location)),
  logo: localStorage.getItem(LS.logo) || "",
  folderId: localStorage.getItem(LS.folderId) || "",
  folderName: localStorage.getItem(LS.folderName) || "",
  job:"", stream:null, facing:"environment",
  zoom:1, zoomMode:"none", zoomTrack:null,
  nav:[{id:ROOT_FOLDER_ID,name:ROOT_FOLDER_NAME}], chosen:null, afterAuth:null,
  interactiveTried:false
};
var logoImg = null;

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function toast(msg,kind){ var t=$("toast"); t.textContent=msg; t.className="toast show "+(kind||"");
  clearTimeout(t._t); t._t=setTimeout(function(){t.className="toast";},2600); }
function status(msg){ $("statusLine").textContent=msg||""; }
function parseJob(name){
  if(!name) return "";
  var m=name.match(/[A-Z]{2,4}[-\s]?\d{4}[-\s]?\d{2,4}/i);
  return m ? m[0].toUpperCase().replace(/\s/g,"-") : name;
}
function refreshTarget(){
  state.job=parseJob(state.folderName);
  $("pillJob").innerHTML="Job#: <b>"+(state.job||"&mdash;")+"</b>";
  $("pillLoc").innerHTML="Loc: <b>"+(state.location||"&mdash;")+"</b>";
  drawHud();
}
function pad(n){ return String(n).padStart(2,"0"); }
function stamp(){
  var d=new Date();
  var date=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  var time=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  return { date:date, time:time,
    lines:[ "Job#: "+(state.job||"(no folder)"), "Location: "+(state.location||"—"), date+"  "+time ] };
}
function drawHud(){
  var s=stamp();
  $("hudRow").innerHTML=s.lines.map(function(l){return "<span>"+l+"</span>";}).join("");
}
setInterval(function(){ if($("canvas").style.display==="none") drawHud(); },1000);

/* ---------- camera ---------- */
function stopCamera(){ if(state.stream){ state.stream.getTracks().forEach(function(t){t.stop();}); state.stream=null; } resetZoom(); }

/* ---------- zoom (hardware where available, digital fallback for iOS Safari) ---------- */
function resetZoom(){
  state.zoom=1; state.zoomMode="none"; state.zoomTrack=null;
  var v=$("video"); if(v){ v.style.transform=""; }
  $("zoombar").classList.remove("on");
  $("zoomSlider").value=1; $("zlbl").innerHTML="1.0&times;";
}
function setupZoom(stream){
  var track=stream.getVideoTracks()[0]; if(!track) return;
  state.zoomTrack=track;
  var caps=(track.getCapabilities?track.getCapabilities():{})||{};
  var sl=$("zoomSlider");
  if(caps.zoom && typeof caps.zoom.max==="number" && caps.zoom.max>caps.zoom.min){
    state.zoomMode="hw";
    sl.min=caps.zoom.min; sl.max=caps.zoom.max;
    sl.step=caps.zoom.step||((caps.zoom.max-caps.zoom.min)/100);
    sl.value=caps.zoom.min; state.zoom=caps.zoom.min;
  }else{
    state.zoomMode="digital";
    sl.min=1; sl.max=5; sl.step=0.1; sl.value=1; state.zoom=1;
  }
  $("zoombar").classList.add("on");
  updateZoomLabel();
}
function updateZoomLabel(){
  var base=(state.zoomMode==="hw")?(+$("zoomSlider").min||1):1;
  var mult=base>0?(state.zoom/base):state.zoom;
  $("zlbl").innerHTML=(mult).toFixed(1)+"&times;";
}
function applyZoom(val){
  val=+val; state.zoom=val;
  if(state.zoomMode==="hw" && state.zoomTrack){
    try{ state.zoomTrack.applyConstraints({advanced:[{zoom:val}]}); }catch(e){}
    $("video").style.transform="";
  }else if(state.zoomMode==="digital"){
    $("video").style.transformOrigin="center center";
    $("video").style.transform="scale("+val+")";
  }
  updateZoomLabel();
}
function startCamera(){
  stopCamera(); $("camMsg").style.display="none";
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:state.facing}, width:{ideal:8192}, height:{ideal:8192}, resizeMode:"none" }, audio:false })
  .then(function(stream){
    state.stream=stream; var v=$("video"); v.srcObject=stream; v.style.display="block"; $("canvas").style.display="none";
    v.play().catch(function(){});
    setupZoom(stream);
  }).catch(function(e){
    $("camMsg").style.display="flex";
    $("camMsgTxt").textContent="Camera unavailable — use the picture button to pick a photo. ("+e.name+")";
  });
}

/* ---------- watermark (text drawn directly on the photo, no panel) ---------- */
function drawWatermark(src,w,h){
  var c=$("canvas"); c.width=w; c.height=h; var ctx=c.getContext("2d");
  ctx.drawImage(src,0,0,w,h);

  var padpx=Math.round(w*0.03);
  var fs=Math.max(20,Math.round(w*0.030));
  var lh=Math.round(fs*1.34);
  var s=stamp();

  ctx.textBaseline="alphabetic";
  ctx.textAlign="left";
  ctx.lineJoin="round";
  ctx.miterLimit=2;

  // bottom-left, stacked from the bottom up: Job# (top, bold) → Location → date/time (bottom)
  var baseY=h-padpx;
  for(var i=s.lines.length-1;i>=0;i--){
    var big=(i===0);
    var f=big?Math.round(fs*1.1):fs;
    ctx.font=(big?"800 ":"700 ")+f+"px -apple-system,Segoe UI,Roboto,Arial,sans-serif";
    var y=baseY-(s.lines.length-1-i)*lh;
    // soft shadow for separation on busy backgrounds
    ctx.shadowColor="rgba(0,0,0,0.55)"; ctx.shadowBlur=Math.round(f*0.5);
    ctx.shadowOffsetX=0; ctx.shadowOffsetY=Math.round(f*0.06);
    // dark outline
    ctx.lineWidth=Math.max(2,Math.round(f*0.17));
    ctx.strokeStyle="rgba(0,0,0,0.9)";
    ctx.strokeText(s.lines[i], padpx, y);
    // white fill
    ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.fillStyle="#ffffff";
    ctx.fillText(s.lines[i], padpx, y);
  }

  // logo, top-right, directly on the photo
  if(logoImg){
    var logoH=Math.round(h*0.085);
    var logoW=Math.round(logoH*(logoImg.width/logoImg.height));
    ctx.shadowColor="rgba(0,0,0,0.45)"; ctx.shadowBlur=Math.round(logoH*0.14); ctx.shadowOffsetY=Math.round(logoH*0.03);
    ctx.drawImage(logoImg, w-logoW-padpx, padpx, logoW, logoH);
    ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  }
  return c;
}

var lastBlob=null;
function addThumb(dataUrl){ var g=$("gallery"); var im=new Image(); im.src=dataUrl; g.prepend(im);
  while(g.children.length>3) g.removeChild(g.lastChild); }
function toBlob(c){ return new Promise(function(res){ c.toBlob(res,"image/jpeg",JPEG_QUALITY); }); }
function loadImage(url){ return new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=rej; i.src=url; }); }

/* full-resolution still: ImageCapture.takePhoto() when supported, else fall back to the video frame */
function capture(){
  var v=$("video");
  if(!(state.stream && v.videoWidth)){ toast("Camera not ready","err"); return; }
  var track=state.stream.getVideoTracks()[0];
  if(window.ImageCapture && track && track.readyState==="live"){
    try{
      var ic=new ImageCapture(track);
      ic.takePhoto().then(function(blob){ return loadImage(URL.createObjectURL(blob)); })
        .then(function(img){ finishCapture(img,img.naturalWidth,img.naturalHeight); })
        .catch(function(){ finishCapture(v,v.videoWidth,v.videoHeight); });
      return;
    }catch(e){}
  }
  finishCapture(v,v.videoWidth,v.videoHeight);
}
function finishCapture(src,w,h){
  // digital zoom: crop the centre by 1/zoom and rescale to full w×h so the saved
  // photo matches the zoomed preview (hardware zoom is already baked into the frame)
  if(state.zoomMode==="digital" && state.zoom>1){
    var z=state.zoom, cw=Math.round(w/z), ch=Math.round(h/z);
    var sx=Math.round((w-cw)/2), sy=Math.round((h-ch)/2);
    var tmp=document.createElement("canvas"); tmp.width=w; tmp.height=h;
    tmp.getContext("2d").drawImage(src, sx,sy,cw,ch, 0,0,w,h);
    src=tmp;
  }
  var c=drawWatermark(src,w,h);
  $("video").style.display="none"; c.style.display="block";
  toBlob(c).then(function(b){ lastBlob=b; addThumb(c.toDataURL("image/jpeg",0.5)); uploadOrSave(b); });
  setTimeout(function(){ if(state.stream){ $("video").style.display="block"; $("canvas").style.display="none"; } },900);
}
function captureFromFile(file){
  loadImage(URL.createObjectURL(file)).then(function(img){
    finishCapture(img,img.naturalWidth,img.naturalHeight);
  });
}

/* ---------- Google auth + Drive ----------
   Sign in once, then stay signed in. Google hands out access tokens that expire
   after about an hour and gives browser apps no refresh token, so "signed in for
   good" means: cache the token until it expires, then renew it SILENTLY with
   prompt:"" — which reuses the consent already on file and shows no screen. The
   consent dialog only ever reappears if the grant is revoked in the Google
   account, the device signs out of Google, or site data is cleared. */
function markSignedIn(yes){
  $("btnSignin").textContent = yes ? "Signed in" : "Sign in";
  $("signedState").textContent = yes ? "Signed in to Google Drive." : "Not signed in yet.";
}
function saveToken(tok, expiresIn){
  state.token = tok;
  // renew 2 minutes early so a long upload never dies mid-flight on an expiring token
  var exp = Date.now() + ((+expiresIn || 3600) * 1000) - 120000;
  try{ localStorage.setItem(LS.token, tok); localStorage.setItem(LS.tokenExp, String(exp)); }catch(e){}
  markSignedIn(true);
}
function loadToken(){
  try{
    var t = localStorage.getItem(LS.token), e = +(localStorage.getItem(LS.tokenExp) || 0);
    if(t && Date.now() < e){ state.token = t; return true; }
  }catch(e){}
  clearToken();
  return false;
}
function clearToken(){
  state.token = null;
  try{ localStorage.removeItem(LS.token); localStorage.removeItem(LS.tokenExp); }catch(e){}
  markSignedIn(false);
}
function ensureTokenClient(){
  if(!state.clientId){ toast("Add your Client ID in Settings","err"); openSettings(); return false; }
  if(!window.google || !google.accounts){ toast("Google library still loading — try again","err"); return false; }
  if(!state.tokenClient){
    state.tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:state.clientId, scope:SCOPE,
      callback:function(resp){
        if(resp.error){
          // a silent renewal that needs the user is not a failure — ask once, visibly
          if(!state.interactiveTried){
            state.interactiveTried = true;
            state.tokenClient.requestAccessToken({prompt:"consent"});
            return;
          }
          toast("Sign-in failed: "+resp.error,"err"); return;
        }
        state.interactiveTried = false;
        saveToken(resp.access_token, resp.expires_in);
        var f=state.afterAuth; state.afterAuth=null; if(f) f();
        toast("Signed in","ok");
      },
      error_callback:function(){
        if(!state.interactiveTried){
          state.interactiveTried = true;
          state.tokenClient.requestAccessToken({prompt:"consent"});
        }
      }
    });
  }
  return true;
}
function requireAuth(then){
  if(state.token){ if(then) then(); return; }
  if(loadToken()){ if(then) then(); return; }          // cached and still valid
  if(!ensureTokenClient()) return;
  state.afterAuth=then||null;
  state.interactiveTried = false;
  state.tokenClient.requestAccessToken({prompt:""});   // silent when consent already granted
}
function driveList(parentId){
  var q=encodeURIComponent("'"+parentId+"' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false");
  var url="https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id,name)&orderBy=name&pageSize=200";
  return fetch(url,{headers:{Authorization:"Bearer "+state.token}}).then(function(r){
    if(r.status===401){ clearToken(); throw new Error("auth"); }
    if(r.status===404){ throw new Error("The production photo folder could not be found. Check that this account has access to it."); }
    return r.json();
  }).then(function(j){ return j.files||[]; });
}
function uploadOrSave(blob){
  if(!state.folderId){ toast("Pick a job folder first","err"); openFolder(); return; }
  requireAuth(function(){
    status("Uploading to "+state.folderName+"…");
    var s=stamp();
    var name=(state.job||"photo")+"_"+s.date+"_"+s.time.replace(/:/g,"-")+".jpg";
    var meta={ name:name, parents:[state.folderId] };
    var form=new FormData();
    form.append("metadata", new Blob([JSON.stringify(meta)],{type:"application/json"}));
    form.append("file", blob);
    fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
      { method:"POST", headers:{Authorization:"Bearer "+state.token}, body:form })
    .then(function(r){
      if(r.status===401){ clearToken(); uploadOrSave(blob); return null; }
      if(!r.ok){ throw new Error("HTTP "+r.status); }
      return r.json();
    }).then(function(j){ if(j){ status(""); toast("Saved: "+j.name,"ok"); } })
    .catch(function(e){ status(""); toast("Upload failed: "+e.message,"err"); });
  });
}

/* ---------- folder picker UI ----------
   nav[0] is always the pinned production root, so the crew can never browse above
   it — there is no breadcrumb back to My Drive because My Drive is never entered. */
function openFolder(){
  requireAuth(function(){
    state.nav=[{id:ROOT_FOLDER_ID,name:ROOT_FOLDER_NAME}];
    state.chosen=null; renderFolder(); $("sheetFolder").classList.add("open");
  });
}
function atRoot(){ return state.nav.length===1; }
function renderFolder(){
  var cur=state.nav[state.nav.length-1];
  $("crumbs").innerHTML=state.nav.map(function(n,i){
    return "<span data-i='"+i+"'>"+n.name+"</span>"+(i<state.nav.length-1?" <i>&rsaquo;</i> ":"");
  }).join("");
  // the root itself is a container, not a job — it can never be the upload target
  $("btnUseThis").disabled = atRoot();
  $("btnUseThis").textContent = atRoot() ? "Open a job folder to continue" : "Use this folder";
  $("folderList").innerHTML="<div class='item'>Loading…</div>";
  driveList(cur.id).then(function(folders){
    if(!folders.length){
      $("folderList").innerHTML = atRoot()
        ? "<div class='item' style='color:var(--err)'>No job folders yet. Run the daily job-folder sync.</div>"
        : "<div class='item' style='color:var(--muted)'>No sub-folders here. Tap “Use this folder”.</div>";
      return;
    }
    $("folderList").innerHTML=folders.map(function(f){
      var safe=f.name.replace(/"/g,"&quot;");
      return "<div class='item' data-id='"+f.id+"' data-name=\""+safe+"\">&#128193; <span>"+f.name+"</span><span class='use'>open &rsaquo;</span></div>";
    }).join("");
  }).catch(function(e){
    if(e.message==="auth"){ toast("Session expired — sign in again","err"); requireAuth(renderFolder); return; }
    $("folderList").innerHTML="<div class='item' style='color:var(--err)'>Error: "+e.message+"</div>";
  });
}
$("folderList").addEventListener("click",function(e){
  var item=e.target.closest(".item"); if(!item||!item.dataset.id) return;
  state.nav.push({id:item.dataset.id,name:item.dataset.name});
  state.chosen={id:item.dataset.id,name:item.dataset.name}; renderFolder();
});
$("crumbs").addEventListener("click",function(e){
  var s=e.target.closest("span"); if(!s) return;
  var i=+s.dataset.i; state.nav=state.nav.slice(0,i+1);
  state.chosen=i>0?state.nav[i]:null; renderFolder();
});
$("btnUseThis").onclick=function(){
  var cur=state.chosen||state.nav[state.nav.length-1];
  // belt and braces: the pinned root is a container, never a destination
  if(!cur || cur.id===ROOT_FOLDER_ID || cur.id==="root"){ toast("Open a job folder first","err"); return; }
  state.folderId=cur.id; state.folderName=cur.name;
  localStorage.setItem(LS.folderId,cur.id); localStorage.setItem(LS.folderName,cur.name);
  refreshTarget(); $("sheetFolder").classList.remove("open"); toast("Folder set: "+cur.name,"ok");
};
$("btnCloseFolder").onclick=function(){ $("sheetFolder").classList.remove("open"); };
$("btnPickFolder").onclick=openFolder;

/* ---------- settings UI ---------- */
function openSettings(){
  $("inClientId").value=state.clientId;
  $("inLocation").value=state.location;
  if(state.logo){ $("logoPrev").src=state.logo; $("logoPrev").style.display="block"; }
  $("signedState").textContent=state.token?"Signed in to Google Drive.":"Not signed in yet.";
  $("sheetSettings").classList.add("open");
}
$("btnSettings").onclick=openSettings;
$("btnCloseSettings").onclick=function(){ $("sheetSettings").classList.remove("open"); };
$("btnLogo").onclick=function(){ $("logoInput").click(); };
$("logoInput").onchange=function(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){ state.logo=rd.result; $("logoPrev").src=rd.result; $("logoPrev").style.display="block"; };
  rd.readAsDataURL(f);
};
$("btnSaveSettings").onclick=function(){
  var newClientId=$("inClientId").value.trim()||DEFAULT_CLIENT_ID;
  // a different Google project invalidates the cached token — drop it, don't strand the app on a dead one
  if(newClientId!==state.clientId) clearToken();
  state.clientId=newClientId;
  state.location=$("inLocation").value.trim()||DEFAULT_LOCATION;
  localStorage.setItem(LS.clientId,state.clientId);
  localStorage.setItem(LS.location,state.location);
  if(state.logo) localStorage.setItem(LS.logo,state.logo);
  state.tokenClient=null; loadLogo(); refreshTarget();
  $("sheetSettings").classList.remove("open"); toast("Settings saved","ok");
};
function loadLogo(){ if(state.logo){ var i=new Image(); i.onload=function(){ logoImg=i; }; i.src=state.logo; } else logoImg=null; }

/* ---------- wire up ---------- */
$("btnSignin").onclick=function(){ requireAuth(function(){}); };
$("btnShutter").onclick=capture;
$("btnFlip").onclick=function(){ state.facing=state.facing==="environment"?"user":"environment"; startCamera(); };
$("btnFile").onclick=function(){ $("fileInput").click(); };
$("fileInput").onchange=function(e){ var f=e.target.files[0]; if(f) captureFromFile(f); e.target.value=""; };

/* zoom slider */
$("zoomSlider").addEventListener("input",function(e){ applyZoom(e.target.value); });

/* pinch-to-zoom on the camera stage */
(function(){
  var stage=$("stage"), startDist=0, startVal=1;
  function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  stage.addEventListener("touchstart",function(e){
    if(e.touches.length===2 && state.zoomMode!=="none"){ startDist=dist(e.touches); startVal=state.zoom; }
  },{passive:true});
  stage.addEventListener("touchmove",function(e){
    if(e.touches.length===2 && startDist>0){
      e.preventDefault();
      var sl=$("zoomSlider"), min=+sl.min, max=+sl.max;
      var val=startVal*(dist(e.touches)/startDist);
      val=Math.max(min,Math.min(max,val));
      sl.value=val; applyZoom(val);
    }
  },{passive:false});
  stage.addEventListener("touchend",function(e){ if(e.touches.length<2) startDist=0; },{passive:true});
})();

/* ---------- init ---------- */
$("rootLabel").textContent = ROOT_FOLDER_NAME;
loadLogo(); refreshTarget(); startCamera();
// restore a still-valid session so the crew opens the app already signed in
if(loadToken()) markSignedIn(true);
</script>
</body>
</html>
